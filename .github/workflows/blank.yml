# ================= DATABASE =================
def create_database():  
    conn = sqlite3.connect(DB)
    cur = conn.cursor()

    cur.execute("""
    CREATE TABLE IF NOT EXISTS products(
        code TEXT PRIMARY KEY,  
        name TEXT,  
        cost_price INTEGER,  
        sell_price INTEGER,  
        stock INTEGER
    )""")

    cur.execute("""
    CREATE TABLE IF NOT EXISTS customers(
        id INTEGER PRIMARY KEY AUTOINCREMENT,  
        name TEXT,  
        mobile TEXT
    )""")

    cur.execute("""
    CREATE TABLE IF NOT EXISTS bills(
        id INTEGER PRIMARY KEY AUTOINCREMENT,  
        bill_no TEXT,  
        customer TEXT,  
        mobile TEXT,  
        total INTEGER,  
        discount INTEGER,  
        final_total INTEGER,  
        profit INTEGER,  
        payment TEXT,  
        date TEXT
    )""")

    cur.execute("""
    CREATE TABLE IF NOT EXISTS purchases(
        id INTEGER PRIMARY KEY AUTOINCREMENT,  
        product_code TEXT,  
        supplier TEXT,  
        qty INTEGER,  
        date TEXT
    )""")

    conn.commit()
    conn.close()

create_database()

