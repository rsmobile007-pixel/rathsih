# ================= DAILY REPORT =================
def daily_report():  
    today = datetime.now().strftime("%d-%m-%Y")

    try:
        conn = sqlite3.connect(DB)
        cur = conn.cursor()

        cur.execute("SELECT SUM(final_total), SUM(profit) FROM bills WHERE date LIKE ?",  
                    (f"%{today}%",))

        data = cur.fetchone()
        conn.close()

        sales = data[0] if data[0] else 0
        profit = data[1] if data[1] else 0

        messagebox.showinfo("Daily Report",  
                            f"Today's Sales: ₹{sales}\nToday's Profit: ₹{profit}")
    except sqlite3.OperationalError as e:
        messagebox.showerror("Database Error", f"Could not generate daily report: {e}")

# ================= PROFIT REPORT =================
def profit_report():  
    try:
        conn = sqlite3.connect(DB)
        cur = conn.cursor()

        cur.execute("SELECT SUM(profit) FROM bills")
        total = cur.fetchone()[0]
        conn.close()

        messagebox.showinfo("Profit Report",  
                            f"Total Profit: ₹{total if total else 0}")
    except sqlite3.OperationalError as e:
        messagebox.showerror("Database Error", f"Could not generate profit report: {e}")

# ================= PURCHASE ENTRY =================
def purchase_entry():  
    win = tk.Toplevel()
    win.title("Purchase Entry")

    tk.Label(win, text="Product Code").pack()
    code = tk.Entry(win); code.pack()

    tk.Label(win, text="Supplier Name").pack()
    supplier = tk.Entry(win); supplier.pack()

    tk.Label(win, text="Quantity").pack()
    qty = tk.Entry(win); qty.pack()

    def add_stock():  
        try:
            conn = sqlite3.connect(DB)
            cur = conn.cursor()

            cur.execute("UPDATE products SET stock=stock+? WHERE code=?",  
                        (int(qty.get()), code.get()))

            cur.execute("""INSERT INTO purchases
                           (product_code, supplier, qty, date)
                           VALUES(?, ?, ?, ?)""",  
                        (code.get(),  
                         supplier.get(),  
                         int(qty.get()),  
                         datetime.now().strftime("%d-%m-%Y %H:%M")))

            conn.commit()
            conn.close()

            messagebox.showinfo("Success", "Stock Updated")
            win.destroy()
        except sqlite3.OperationalError as e:
            messagebox.showerror("Database Error", f"Could not update stock: {e}")
        except Exception as e:
            messagebox.showerror("Error", f"Error updating stock: {e}")

    tk.Button(win, text="ADD STOCK",  
              bg="green", fg="white",  
              command=add_stock).pack(pady=10)
    
